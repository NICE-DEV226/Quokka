[package]
name = "quokka"
description = "Quokka — smart local AI router & high-performance local inference engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
quokka-hardware = { workspace = true }
quokka-core = { workspace = true }
quokka-server = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indicatif = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
tracing-subscriber = { workspace = true }
rmcp = { workspace = true }

[lints]
workspace = true

# Forward des backends GPU vers quokka-core pour les builds release.
[features]
default = []
cuda = ["quokka-core/cuda"]
vulkan = ["quokka-core/vulkan"]
metal = ["quokka-core/metal"]
