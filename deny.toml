# cargo-deny — gates licence & sécurité exécutés par `ci.yml` (ARCHITECTURE.md §2).

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-apple-darwin" },
    { triple = "aarch64-unknown-linux-gnu" },
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Certificats racine embarqués (webpki-roots via rustls) — licence de
    # données permissive, sans clause copyleft.
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "0BSD",
]
confidence-threshold = 0.93

[bans]
# Les doublons de versions sont tolérés (warning) : l'arbre `ash`/`sysinfo`
# n'est pas sous notre contrôle et le binaire final est strippé.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
