name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (DoD §8.2)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

  check:
    # Smoke compile par OS : `gpu/metal.rs` n'existe que sous macOS et les
    # chemins `cfg(windows)` ne sont jamais exercés par le job ubuntu.
    name: cargo check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install CMake (Windows)
        # Le cmake préinstallé du runner mélange ses modules 4.4/4.5 et
        # VS 2022 a disparu de l'image (VS 2026 seulement) : il faut un
        # cmake ≥4.2 cohérent, installé depuis le zip officiel.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "4.3.2"
          curl.exe -L "https://github.com/Kitware/CMake/releases/download/v$ver/cmake-$ver-windows-x86_64.zip" -o cmake.zip
          Expand-Archive cmake.zip -DestinationPath "$env:RUNNER_TEMP\cmake" -Force
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\cmake\cmake-$ver-windows-x86_64\bin"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check all targets
        if: runner.os != 'Windows'
        run: cargo check --workspace --all-targets --locked

      - name: Check all targets (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Le cache rust conserve le CMakeCache.txt du run précédent
          # (configuré avec un autre générateur/toolchain) → purge ciblée
          # pour immuniser contre la dérive de l'image runner.
          rm -rf target/debug/build/llama-cpp-sys-2*
          cargo check --workspace --all-targets --locked

  deny:
    name: cargo-deny (licenses · advisories · bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
