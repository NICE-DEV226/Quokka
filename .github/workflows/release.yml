name: release

# Build release matrix par OS/backend GPU, déclenché par les tags `v*`.
# Chaque leg compile le binaire `quokka` en --release avec les features
# backend correspondantes (voir [features] de quokka-core) puis
# l'embarque avec la Web UI compilée (rust-embed lit ui/dist au build).
#
# CUDA tourne dans un container nvidia/cuda : les runners GitHub
# n'embarquent plus le toolkit dans le PATH. Windows-CUDA n'est pas
# buildé (install du toolkit trop lourde/flaky sur windows-latest) —
# documenté comme build-from-source.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-cpu
            os: ubuntu-latest
            features: ""
            archive: tar.gz
          - name: linux-x86_64-vulkan
            os: ubuntu-latest
            features: vulkan
            archive: tar.gz
            apt: "libvulkan-dev glslc glslang-tools spirv-headers"
          - name: windows-x86_64-cpu
            os: windows-latest
            features: ""
            archive: zip
          - name: macos-aarch64-metal
            os: macos-latest
            features: metal
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup Node (Web UI embarquée)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build Web UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Install system deps (Linux)
        if: runner.os == 'Linux' && matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Ensure cmake (macOS)
        if: runner.os == 'macOS'
        run: command -v cmake >/dev/null || brew install cmake

      - name: Install CMake (Windows)
        # cmake préinstallé mélangé (modules 4.4/4.5) + VS 2022 retiré de
        # l'image → cmake ≥4.2 cohérent depuis le zip officiel.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "4.3.2"
          curl.exe -L "https://github.com/Kitware/CMake/releases/download/v$ver/cmake-$ver-windows-x86_64.zip" -o cmake.zip
          Expand-Archive cmake.zip -DestinationPath "$env:RUNNER_TEMP\cmake" -Force
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\cmake\cmake-$ver-windows-x86_64\bin"

      - name: Build quokka (${{ matrix.name }})
        shell: bash
        run: |
          args=(--release -p quokka --locked)
          if [ -n "${{ matrix.features }}" ]; then
            args+=(--features "${{ matrix.features }}")
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Le cache rust conserve l'ancien CMakeCache.txt (autre
            # générateur/toolchain) → purge pour repartir propre.
            rm -rf target/release/build/llama-cpp-sys-2*
          fi
          cargo build "${args[@]}"

      - name: Package binary (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist/quokka-${{ matrix.name }}
          cp target/release/quokka dist/quokka-${{ matrix.name }}/
          cp LICENSE README.md dist/quokka-${{ matrix.name }}/ 2>/dev/null || true
          tar -czf "quokka-${{ matrix.name }}.tar.gz" -C dist quokka-${{ matrix.name }}

      - name: Package binary (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/quokka-${{ matrix.name }} | Out-Null
          Copy-Item target/release/quokka.exe dist/quokka-${{ matrix.name }}/
          Copy-Item README.md dist/quokka-${{ matrix.name }}/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/quokka-${{ matrix.name }} -DestinationPath "quokka-${{ matrix.name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quokka-${{ matrix.name }}
          path: quokka-${{ matrix.name }}.${{ matrix.archive }}
          if-no-files-found: error

  build-cuda:
    # Leg CUDA Linux dans un container toolkit — les runners GitHub
    # n'exposent plus nvcc sur le PATH.
    name: linux-x86_64-cuda
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4

      # Avant rustup : l'image cuda ne fournit pas curl.
      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y build-essential cmake pkg-config curl git libclang-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify CUDA toolkit
        run: nvcc --version | tail -2

      - name: Setup Node (Web UI embarquée)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build Web UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      # build.rs de llama-cpp-sys-2 ne déclare rerun-if-env-changed que
      # pour les vars GGML_* : un changement de CMAKE_CUDA_ARCHITECTURES
      # ne re-déclenche pas cmake et le cache rust livrerait l'ancien
      # binaire. On purge le package natif pour forcer une configure
      # CMake propre (coût ~30-45 min, acceptable pour une release).
      - name: Force llama.cpp rebuild
        run: cargo clean -p llama-cpp-sys-2 --release

      - name: Build quokka (cuda)
        env:
          # Sans GPU au build, ggml-cuda compile du SASS "real" par
          # arch → binaire de ~940 Mo. En "virtual" seul on n'embarque
          # que du PTX : le driver CUDA le JIT-compile au premier run
          # (cache driver ensuite) et la compatibilité ascendante PTX
          # couvre les archs cibles sans cubin SASS par arch.
          # Trade-off assumé : quelques secondes de JIT au premier
          # lancement sur la machine de l'utilisateur.
          # Couverture : sm_80+ (Ampere 2020 → Blackwell). compute_80
          # couvre sm_80-89, compute_90 couvre sm_90/100/120 avec les
          # chemins optimisés de chaque génération. Turing (sm_75) et
          # avant → leg Vulkan (16 Mo) qui supporte ces GPU.
          CMAKE_CUDA_ARCHITECTURES: "80-virtual;90-virtual"
        run: cargo build --release -p quokka --locked --features cuda

      - name: Package binary
        run: |
          mkdir -p dist/quokka-linux-x86_64-cuda
          cp target/release/quokka dist/quokka-linux-x86_64-cuda/
          cp LICENSE README.md dist/quokka-linux-x86_64-cuda/ 2>/dev/null || true
          tar -czf quokka-linux-x86_64-cuda.tar.gz -C dist quokka-linux-x86_64-cuda

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quokka-linux-x86_64-cuda
          path: quokka-linux-x86_64-cuda.tar.gz
          if-no-files-found: error

  release:
    name: github release
    needs: [build, build-cuda]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --repo explicite : pas de checkout dans ce job, gh release
          # create résoudrait sinon le dépôt via git remote.
          gh release create "${{ github.ref_name }}" artifacts/* \
            --repo "${{ github.repository }}" \
            --title "Quokka ${{ github.ref_name }}" \
            --notes "Automated release — binaries per OS/GPU backend. See README for hardware requirements."
